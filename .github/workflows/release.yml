name: Release Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  # Issue de ativacao de ads em producao -- disparo manual permite escolher trilha/ads
  # explicitamente (Luiz), sem alterar o default do push de tag (sempre beta/ads=false).
  # Pre-requisito antes de rodar com playTrack=production e adsEnabled=true: as chaves de
  # Firebase Remote Config (ads_native_enabled + 5 por tela, ver AdsRemoteConfigRepository.kt)
  # precisam existir no console -- sem elas o app publicado ainda nao mostra anuncio de
  # verdade (AdsFlagsManager cai no fallback DESLIGADO), mesmo com o binario certo.
  #
  # Decisao do Luiz (2026-08-27, PR #1805): sem gate de GitHub Environment/required reviewers
  # pro disparo manual de producao -- o dropdown do workflow_dispatch + o guardrail que rejeita
  # adsEnabled=true fora de playTrack=production (step abaixo) bastam por enquanto. Nao reabrir
  # essa pergunta em revisao futura sem novo pedido explicito.
  workflow_dispatch:
    inputs:
      playTrack:
        description: 'Trilha Play Console (produção com ads reais exige decisão explícita do Luiz)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production
      adsEnabled:
        description: 'Habilitar anúncios neste build (requer chaves Firebase Remote Config já criadas)'
        required: true
        default: false
        type: boolean

jobs:
  build-release:
    runs-on: ubuntu-latest

    # Bloqueio B4 do parecer de Caio (PR #1805): valores resolvidos uma unica vez aqui, em vez de
    # repetir a mesma expressao -PplayTrack=... -PadsEnabled=... nos 4 comandos Gradle abaixo —
    # a duplicacao era exatamente o vetor de drift que o comentario do step de build ja alertava
    # (AAB publicado divergindo do artefato do GitHub Release / mapping do Crashlytics).
    env:
      PLAY_TRACK: ${{ inputs.playTrack || 'beta' }}
      ADS_ENABLED_BUILD: ${{ inputs.adsEnabled || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decodificar google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Decodificar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/segredos/signallq.jks

      - name: Criar key.properties
        run: |
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=segredos/signallq.jks
          PROPS

      - name: Permissao gradlew
        run: chmod +x android/gradlew

      # Escala com o Luiz na PR #1805: disparo manual com playTrack != production e
      # adsEnabled=true compilaria USE_TEST_ADS=true + ADS_ENABLED=true — anuncio de TESTE do
      # Google servido pra usuario real de beta/internal/alpha, sem receita e com cara de app
      # quebrado. Bloqueado aqui, antes de qualquer build caro rodar.
      - name: Guardrail — adsEnabled só é permitido com playTrack=production
        run: |
          if [ "$ADS_ENABLED_BUILD" = "true" ] && [ "$PLAY_TRACK" != "production" ]; then
            echo "::error::adsEnabled=true só é permitido com playTrack=production (trilha atual: $PLAY_TRACK) — isso serviria Ad Unit ID de TESTE do Google para usuários reais dessa trilha."
            exit 1
          fi
          echo "Build resolvido: playTrack=$PLAY_TRACK adsEnabled=$ADS_ENABLED_BUILD"

      - name: Extrair versao
        id: versao
        run: |
          NAME=$(grep 'versionName' android/gradle/libs.versions.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          CODE=$(grep 'versionCode' android/gradle/libs.versions.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Clean build
        run: cd android && ./gradlew clean --no-build-cache --no-daemon

      # -PplayTrack aqui precisa bater exatamente com o valor usado no step "Publicar na Play
      # Console" mais abaixo (issue #1330, continuacao) -- AdUnitIds.para(slot) agora depende de
      # -PplayTrack (via BuildConfig.USE_TEST_ADS, ver app/build.gradle.kts) para decidir Ad Unit
      # ID real vs teste. Se os valores divergissem entre build e publish, o Gradle recompilaria
      # o BuildConfig na hora de publicar (mesmo --no-daemon, via up-to-date check) e o AAB
      # publicado na Play divergiria do artefato ja anexado ao GitHub Release e do mapping.txt
      # ja enviado ao Crashlytics.
      #
      # inputs.playTrack/inputs.adsEnabled so existem em disparo manual (workflow_dispatch);
      # push de tag normal cai no fallback beta/false -- comportamento automatico inalterado.
      - name: Build APK release
        run: cd android && ./gradlew :app:assembleRelease --no-build-cache --no-daemon -PplayTrack=$PLAY_TRACK -PadsEnabled=$ADS_ENABLED_BUILD
        env:
          ADMIN_INGEST_KEY: ${{ secrets.ADMIN_INGEST_KEY }}
          NDS_API_TOKEN: ${{ secrets.NDS_API_TOKEN }}

      - name: Build AAB release
        run: cd android && ./gradlew :app:bundleRelease --no-build-cache --no-daemon -PplayTrack=$PLAY_TRACK -PadsEnabled=$ADS_ENABLED_BUILD
        env:
          ADMIN_INGEST_KEY: ${{ secrets.ADMIN_INGEST_KEY }}
          NDS_API_TOKEN: ${{ secrets.NDS_API_TOKEN }}

      - name: Renomear artefatos
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab \
             android/app/build/outputs/bundle/release/signallq-${{ steps.versao.outputs.name }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/signallq-${{ steps.versao.outputs.name }}.apk

      - name: Upload mapping.txt para Crashlytics
        run: cd android && ./gradlew :app:uploadCrashlyticsMappingFileRelease --no-daemon -PplayTrack=$PLAY_TRACK -PadsEnabled=$ADS_ENABLED_BUILD
        env:
          ADMIN_INGEST_KEY: ${{ secrets.ADMIN_INGEST_KEY }}
          NDS_API_TOKEN: ${{ secrets.NDS_API_TOKEN }}

      - name: Ler release notes públicas
        id: notas
        run: |
          NOTAS_FILE="android/app/src/main/play/release-notes/pt-BR/default.txt"
          if [ -f "$NOTAS_FILE" ]; then
            {
              echo "corpo<<NOTASEOF"
              cat "$NOTAS_FILE"
              echo "NOTASEOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "corpo=Ver CHANGELOG interno." >> "$GITHUB_OUTPUT"
          fi

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # No workflow_dispatch não há tag de GitHub por definição. Declarar a tag
          # permite que o release manual de produção a crie no commit que foi
          # compilado, sem depender do gatilho automático (que publica em beta).
          tag_name: v${{ steps.versao.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: "SignallQ v${{ steps.versao.outputs.name }} (build ${{ steps.versao.outputs.code }})"
          body: ${{ steps.notas.outputs.corpo }}
          draft: false
          files: |
            android/app/build/outputs/bundle/release/signallq-*.aab
            android/app/build/outputs/apk/release/signallq-*.apk

      # Publica o AAB assinado na trilha escolhida da Play Console (default: beta,
      # anuncios desligados). Producao com anuncios reais (playTrack=production,
      # adsEnabled=true) exige disparo manual deste workflow (workflow_dispatch) com os
      # inputs correspondentes -- NAO acontece num push de tag comum -- e as chaves de
      # Firebase Remote Config ja criadas (ver nota no gatilho `on:` acima). Promover o
      # MESMO binario via promote-release.yml nao ativa anuncio: USE_TEST_ADS/ADS_ENABLED
      # ja estao compilados no AAB desde o build, a promocao so move o artefato entre
      # trilhas sem recompilar.
      # Requer o app criado na Play e um primeiro upload manual na trilha (a API nao cria o app do zero).
      # Roda por ultimo: uma falha aqui nao invalida o GitHub Release nem os artefatos ja gerados.
      - name: Publicar na Play Console
        run: cd android && ./gradlew :app:publishReleaseBundle --no-daemon -PplayTrack=$PLAY_TRACK -PadsEnabled=$ADS_ENABLED_BUILD
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ADMIN_INGEST_KEY: ${{ secrets.ADMIN_INGEST_KEY }}
          NDS_API_TOKEN: ${{ secrets.NDS_API_TOKEN }}
