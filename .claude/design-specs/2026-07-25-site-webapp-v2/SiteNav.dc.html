<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="assets/google-sans-flex.css">
  <link rel="stylesheet" href="_ds/signallq-design-system-2d25d7a1-31b2-4ac3-881f-72dbc8f35a29/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/signallq-design-system-2d25d7a1-31b2-4ac3-881f-72dbc8f35a29/styles.css">
  <script src="_ds/signallq-design-system-2d25d7a1-31b2-4ac3-881f-72dbc8f35a29/_ds_bundle.js"></script>
  <style>
    :root {
      --gal-bg:    #E9E6EF;
      --gal-fg:    #1C1B1F;
      --gal-muted: #5C5670;
      --gal-bezel: #26232E;
      --gal-neck:  #33303B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent:        #D0BCFF;
        --on-accent:     #371E73;
        --accent-blue:   #AAC7FF;
        --success:       #83DA99;
        --warning:       #FFB870;
        --error:         #FFB4AB;
        --phase-latencia:#AAC7FF;
        --phase-download:#83DA99;
        --phase-upload:  #FFB870;
        --bg-primary:    #131217;
        --bg-secondary:  #1D1B20;
        --bg-card:       #211F26;
        --text-primary:  #E6E0E9;
        --text-secondary:#CAC4D0;
        --text-tertiary: #CAC4D0;
        --border:        #948F99;
        --warning-container:    #693D00;
        --on-warning-container: #FFDDB3;
        --amber-surface:        #2E2000;
        --success-container:    #0A5321;
        --on-success-container: #9DF4AC;
        --gal-bg:    #16151A;
        --gal-fg:    #E6E0E9;
        --gal-muted: #A9A2B4;
        --gal-bezel: #0B0A0F;
        --gal-neck:  #1F1D26;
      }
    }
    @media (prefers-color-scheme: dark) { .sq-logo-light { display: none !important; } .sq-logo-dark { display: block !important; } }
  </style>
</helmet>

<div style="position: sticky; top: 0; z-index: 3; width: 100%; box-sizing: border-box; background: var(--bg-primary);">
  <div style="margin: 0 auto; max-width: 1280px; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; box-sizing: border-box;">
    <img class="sq-logo-light" src="assets/signallq-lockup-light-bg.png" alt="SignallQ" style="height: 70px; width: auto; display: block; flex-shrink: 0;">
    <img class="sq-logo-dark" src="assets/signallq-lockup-dark-bg.png" alt="SignallQ" style="height: 70px; width: auto; display: none; flex-shrink: 0;">

    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 28px;">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
          <span style="white-space: nowrap; padding-bottom: 4px; font: 500 14px/1.43 var(--font-sans); color: {{ link.color }}; border-bottom: 2px solid {{ link.underline }};">{{ link.label }}</span>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center;">
        <x-import component-from-global-scope="SignallqDesignSystem.Icon" name="menu" size="24" hint-size="24px,24px"></x-import>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: -16px; height: 16px; pointer-events: none; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg-primary) 92%, transparent), transparent);"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:76},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;historico&quot;,&quot;como-medimos&quot;,&quot;sobre&quot;,&quot;privacidade&quot;,&quot;termos&quot;,&quot;pro&quot;,&quot;bufferbloat&quot;,&quot;cgnat&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const ITENS = [
  { key: 'home', label: 'Teste' },
  { key: 'historico', label: 'Histórico' },
  { key: 'como-medimos', label: 'Como funciona' },
  { key: 'sobre', label: 'Quem somos' },
  { key: 'privacidade', label: 'Privacidade' },
];

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active;
    const isMobile = !!this.props.mobile;
    return {
      isMobile,
      desktop: !isMobile,
      links: ITENS.map((it) => ({
        label: it.label,
        color: it.key === active ? 'var(--accent)' : 'var(--text-primary)',
        underline: it.key === active ? 'var(--accent)' : 'transparent',
      })),
    };
  }
}

</script>
</body>
</html>
