<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="assets/google-sans-flex.css">
  <link rel="stylesheet" href="_ds/signallq-design-system-2d25d7a1-31b2-4ac3-881f-72dbc8f35a29/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/signallq-design-system-2d25d7a1-31b2-4ac3-881f-72dbc8f35a29/styles.css">
  <script src="_ds/signallq-design-system-2d25d7a1-31b2-4ac3-881f-72dbc8f35a29/_ds_bundle.js"></script>
  <style>
    :root {
      --gal-bg:    #E9E6EF;
      --gal-fg:    #1C1B1F;
      --gal-muted: #5C5670;
      --gal-bezel: #26232E;
      --gal-neck:  #33303B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent:        #D0BCFF;
        --on-accent:     #371E73;
        --accent-blue:   #AAC7FF;
        --success:       #83DA99;
        --warning:       #FFB870;
        --error:         #FFB4AB;
        --phase-latencia:#AAC7FF;
        --phase-download:#83DA99;
        --phase-upload:  #FFB870;
        --bg-primary:    #131217;
        --bg-secondary:  #1D1B20;
        --bg-card:       #211F26;
        --text-primary:  #E6E0E9;
        --text-secondary:#CAC4D0;
        --text-tertiary: #CAC4D0;
        --border:        #948F99;
        --warning-container:    #693D00;
        --on-warning-container: #FFDDB3;
        --amber-surface:        #2E2000;
        --success-container:    #0A5321;
        --on-success-container: #9DF4AC;
        --gal-bg:    #16151A;
        --gal-fg:    #E6E0E9;
        --gal-muted: #A9A2B4;
        --gal-bezel: #0B0A0F;
        --gal-neck:  #1F1D26;
      }
    }
  </style>
</helmet>

<div style="min-height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary);">
  <dc-import name="SiteNav" active="home" mobile="{{ mobile }}" hint-size="100%,76px"></dc-import>

  <div style="flex: 1; width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; gap: 24px; padding: {{ shellPadding }};">
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <dc-import name="AdRail" hint-size="240px,880px"></dc-import>
    </sc-if>

    <div style="flex: 1; max-width: {{ contentMax }}; min-height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;">
      <div style="font: 500 11px/1.45 var(--font-sans); color: var(--text-secondary); letter-spacing: .3px; text-transform: uppercase;">Erro 404</div>
      <div style="font: 700 26px/1.23 var(--font-sans); color: var(--text-primary);">Página não encontrada</div>
      <div style="max-width: 380px; font: 400 14px/1.45 var(--font-sans); color: var(--text-secondary);">O endereço que você acessou não existe ou foi movido.</div>
      <div style="margin-top: 4px; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-radius: var(--radius-button); background: var(--accent);">
        <x-import component-from-global-scope="SignallqDesignSystem.Icon" name="speed" size="20" color="var(--on-accent)" hint-size="20px,20px"></x-import>
        <span style="font: 500 14px/1.43 var(--font-sans); color: var(--on-accent);">Ir para o teste de velocidade</span>
      </div>
    </div>

    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <dc-import name="AdRail" variant="b" hint-size="240px,880px"></dc-import>
    </sc-if>
  </div>

  <div style="width: 100%; box-sizing: border-box; padding: 0 20px 28px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 860px;">
      <dc-import name="AdBannerWide" variant="a" compact="{{ mobile }}" hint-size="100%,140px"></dc-import>
    </div>
  </div>

  <dc-import name="SiteFooter" hint-size="100%,auto"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1050},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mobile = !!this.props.mobile;
    return { mobile, desktop: !mobile, shellPadding: mobile ? '32px 20px 48px' : '20px 24px 16px', contentMax: mobile ? '100%' : '860px' };
  }
}

</script>
</body>
</html>
